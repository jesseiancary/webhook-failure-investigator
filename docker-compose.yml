services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wfi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wfi_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-wfi}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - wfi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-wfi} -d ${POSTGRES_DB:-wfi}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wfi_pgdata:
