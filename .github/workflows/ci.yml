name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, format, test, build
    runs-on: ubuntu-latest
    # Postgres backs the API integration tests (Supertest -> Prisma). typecheck/lint/build
    # don't need it, but it runs alongside so `pnpm test` stays a single command.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wfi
          POSTGRES_PASSWORD: wfi_dev_password
          POSTGRES_DB: wfi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wfi -d wfi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wfi:wfi_dev_password@localhost:5432/wfi?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Apply migrations to the test database
        run: pnpm --filter server exec prisma migrate deploy
      # Intentionally NO OPENAI_API_KEY in this job's env. The key-gated live tests — diagnosis
      # service-level (server/src/diagnosis/diagnosis.live.int.test.ts), diagnosis HTTP-level
      # (server/src/diagnosis/diagnosis.routes.live.int.test.ts), and chat HTTP-level
      # (server/src/diagnosis/chat.live.int.test.ts), all gated via hasOpenAIKey() — must stay skipped
      # in CI; exposing a key here would make every PR run paid, non-deterministic OpenAI calls. That
      # logic is covered deterministically by the stubbed-client integration tests instead
      # (diagnosis.service.int.test.ts, diagnosis.routes.int.test.ts, and chat.routes.int.test.ts).
      - run: pnpm test
      - run: pnpm build

  data-layer:
    name: Prisma schema and migrations
    runs-on: ubuntu-latest
    # Relevant when server/prisma/schema.prisma or server/prisma/migrations/ change
    # (see docs/planned-ci.md: prisma-validate + migration-drift). Runs on every PR for
    # simplicity, consistent with the other always-on jobs; the checks are fast.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wfi
          POSTGRES_PASSWORD: wfi_dev_password
          POSTGRES_DB: wfi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wfi -d wfi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wfi:wfi_dev_password@localhost:5432/wfi?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter server exec prisma validate

      - name: Committed migrations apply cleanly
        run: pnpm --filter server exec prisma migrate deploy

      - name: No schema/migration drift
        # After deploy, the DB reflects the migration history. If schema.prisma was
        # edited without a matching migration, its datamodel diverges from the DB and
        # this diff is non-empty (--exit-code => exit 2).
        run: >-
          pnpm --filter server exec prisma migrate diff
          --from-schema-datasource prisma/schema.prisma
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

  tooling:
    name: Claude tooling gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate .claude/settings.json is valid JSON
        run: jq empty .claude/settings.json

      - name: Shellcheck hooks and CI scripts
        run: shellcheck .claude/hooks/*.sh scripts/ci/*.sh

      - name: Hooks no-op cleanly on irrelevant input
        run: |
          set -euo pipefail
          # A non-TypeScript edit must be a clean no-op (exit 0).
          printf '%s' '{"tool_input":{"file_path":"docs/ROADMAP.md"}}' \
            | .claude/hooks/post-edit-check.sh
          # A non-commit Bash command must pass the pre-commit gate (exit 0).
          printf '%s' '{"tool_input":{"command":"echo hello"}}' \
            | .claude/hooks/pre-commit-gate.sh
          echo "hooks no-op guarantee: ok"

      - name: Frontmatter lint (commands, agents, skills)
        run: ./scripts/ci/check-frontmatter.sh

      - name: Internal doc links resolve
        run: ./scripts/ci/check-doc-links.sh

      - name: No raw secrets in seed/fixture/snapshot data
        run: ./scripts/ci/check-secret-redaction.sh
